<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <!-- Flamme EDF - 5 pétales orange -->
  <g fill="#FF6600">
    <!-- Pétale central haut -->
    <ellipse cx="50" cy="18" rx="8" ry="16" transform="rotate(0, 50, 18)"/>
    <!-- Pétale droite haut -->
    <ellipse cx="68" cy="28" rx="7" ry="14" transform="rotate(72, 68, 28)"/>
    <!-- Pétale droite bas -->
    <ellipse cx="72" cy="52" rx="7" ry="14" transform="rotate(144, 72, 52)"/>
    <!-- Pétale gauche bas -->
    <ellipse cx="28" cy="52" rx="7" ry="14" transform="rotate(-144, 28, 52)"/>
    <!-- Pétale gauche haut -->
    <ellipse cx="32" cy="28" rx="7" ry="14" transform="rotate(-72, 32, 28)"/>
  </g>
  <!-- Texte EDF bleu -->
  <text x="50" y="105" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#0033A0" text-anchor="middle">edf</text>
</svg>
